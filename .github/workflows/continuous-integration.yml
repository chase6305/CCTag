name: Continuous Integration

on:
  push:
    # Skip jobs when only documentation files are changed
   paths-ignore:
     - '**.md'
     - '**.rst'
     - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" 

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: [ "alicevision/cctag-deps:cuda11.8.0-ubuntu20.04", "alicevision/cctag-deps:cuda12.1.0-ubuntu22.04" ]
        build_type: [ "Release", "Debug" ]

    container:
      image: ${{ matrix.container }}

    env:
      DEPS_INSTALL_DIR: /opt/
      BUILD_TYPE: ${{ matrix.build_type }}
      CTEST_OUTPUT_ON_FAILURE: 1
      DOCTEST_VERSION: "2.5.3"
    steps:
      - uses: actions/checkout@v7

      - name: Install test framework
        run: |
          wget -q https://github.com/doctest/doctest/archive/refs/tags/v${DOCTEST_VERSION}.tar.gz -O /tmp/doctest.tar.gz
          tar xf /tmp/doctest.tar.gz -C /tmp
          cmake -S /tmp/doctest-${DOCTEST_VERSION} -B /tmp/doctest-build \
            -DDOCTEST_WITH_TESTS=OFF -DDOCTEST_WITH_MAIN_IN_STATIC_LIB=OFF \
            -DCMAKE_INSTALL_PREFIX:PATH=${DEPS_INSTALL_DIR}
          cmake --install /tmp/doctest-build

      - name: Prepare File Tree
        run: |
          mkdir ./build
          mkdir ./build_as_3rdparty
          mkdir ../cctag_install

      - name: Configure CMake
        working-directory: ./build
        run: |
          cmake .. \
           -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
           -DBUILD_SHARED_LIBS:BOOL=ON \
           -DCMAKE_PREFIX_PATH="${DEPS_INSTALL_DIR}" \
           -DCMAKE_INSTALL_PREFIX:PATH=$PWD/../../cctag_install \
           -DWITH_CUDA:BOOL=ON

      - name: Build
        working-directory: ./build
        run: |
          make -j$(nproc) install

      - name: Unit Tests
        working-directory: ./build
        run: |
          export LD_LIBRARY_PATH=${DEPS_INSTALL_DIR}/lib:${LD_LIBRARY_PATH}
          make test

      - name: Build As Third Party
        working-directory: ./build_as_3rdparty
        run: |
          cmake ../src/applications \
           -DBUILD_SHARED_LIBS:BOOL=ON \
           -DCMAKE_PREFIX_PATH:PATH="$PWD/../../cctag_install;${DEPS_INSTALL_DIR}"
          make -j8
