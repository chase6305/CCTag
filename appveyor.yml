version: '1.0.{build}'

image: Visual Studio 2017

platform:
  - x64

configuration:
  - Release

install:
    # - cmd: >-
    #       call cudaInstallAppveyor.cmd
    - cd C:\Tools\vcpkg
    - git pull
    - git checkout 2022.09.27
    - .\bootstrap-vcpkg.bat
    - cd %APPVEYOR_BUILD_FOLDER%


    - vcpkg upgrade --no-dry-run
    - vcpkg list
    - vcpkg install
          boost-accumulators
          boost-array
          boost-assert
          boost-container
          boost-exception
          boost-filesystem
          boost-ptr-container
          boost-program-options
          boost-serialization
          boost-spirit
          boost-stacktrace
          boost-test
          opencv
          tbb
          eigen3
          --triplet %PLATFORM%-windows
    - vcpkg list

before_build:
    - md build
    - cd build
    - cmake -G "Visual Studio 14 2015" -A x64 -T v140,host=x64 -DCMAKE_BUILD_TYPE=%configuration% -DCMAKE_TOOLCHAIN_FILE=c:/tools/vcpkg/scripts/buildsystems/vcpkg.cmake -DCCTAG_BUILD_APPS:BOOL=ON -DCCTAG_WITH_CUDA:BOOL=OFF -DCCTAG_SERIALIZE:BOOL=ON -DCCTAG_VISUAL_DEBUG:BOOL=ON ..
    - ls -l

build:
  verbosity: detailed
  project: $(APPVEYOR_BUILD_FOLDER)\build\CCTag.sln 
  parallel: true

cache:
  c:\tools\vcpkg\installed\
